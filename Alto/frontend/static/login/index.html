<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alto 0.2a · Login</title>
    <link rel="stylesheet" href="/static/login/style/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Alto 0.2a</h1>
            <p class="tagline">pipeline · streams</p>

            <!-- Login fields -->
            <div id="loginFields" class="form-fields">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
            </div>

            <!-- Signup fields (hidden by default) -->
            <div id="signupFields" class="form-fields" style="display: none;">
                <input type="text" id="signupUsername" placeholder="Username" autocomplete="username">
                <input type="password" id="signupPassword" placeholder="Password (min. 6 characters)" autocomplete="new-password">
                <input type="password" id="signupConfirm" placeholder="Confirm password" autocomplete="new-password">
            </div>

            <button type="submit" id="submitBtn">Login</button>

            <div class="switch-row">
                <span id="switchHint">Don't have an account?</span>
                <button id="switchLink" class="link-btn">Sign up</button>
            </div>
        </div>

        <!-- Error message – absolute positioned inside wrapper -->
        <div class="error-message" id="errorMsg"></div>
    </div>

    <script src="/static/login/javascript/script.js"></script>
</body>
</html>
